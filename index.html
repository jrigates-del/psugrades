let DB = { accounts: [], sections: [], subjects: [], items: [], scores: [] };

let ui = { teacherTab:'sections', selSection:null, selSubject:null, selPeriod:'midterm', studentSelSubject:null, studentSelPeriod:'midterm', showAccount:false };

const DOC_REF_PATH = ['gradeSystem','mainData'];

async function initFirebase(){
  if(firebaseConfig.apiKey.startsWith('PASTE_')){
    document.getElementById('app').innerHTML = `
      <div class="min-h-screen flex items-center justify-center px-6 text-center">

      </div>`;
    throw new Error('Firebase config not set');
  }
  firebase.initializeApp(firebaseConfig);
  await firebase.auth().signInAnonymously();
  db = firebase.firestore();
  firebaseReady = true;
}

function docRef(){ return db.collection(DOC_REF_PATH[0]).doc(DOC_REF_PATH[1]); }

function subscribeDB(){
  docRef().onSnapshot(async (snap)=>{
    if(snap.exists){
      DB = snap.data().payload ? JSON.parse(snap.data().payload) : DB;
    } else {
      seedIfEmpty(); // creates the doc for the first time
      return;
    }
    render();
  }, (err)=>{
    console.error('Firestore listen error', err);
    toast('Live sync error — check your internet connection');
  });
}

async function saveDB(){
  try{ await docRef().set({payload: JSON.stringify(DB), updatedAt: Date.now()}); }
  catch(e){ console.error('Firestore save failed', e); toast('Save failed — check your internet connection'); }
}
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }

function seedIfEmpty(){
  let changed = false;
  if(DB.accounts.length===0){
    DB.accounts.push({id:uid('acc'), role:'teacher', idNumber:'teacher', password:'admin123', name:'Instructor Account'});
    changed = true;
  }
  if(DB.sections.length===0){
    const sec = {id:uid('sec'), name:'BSIT 2A'};
    DB.sections.push(sec);
    const subj = {id:uid('sub'), name:'Computation', sectionId:sec.id, rubric:defaultRubric()};
    DB.subjects.push(subj);
    const demoStudents = [
      {idNumber:'2026-0001', name:'Dela Cruz, Juan'},
      {idNumber:'2026-0002', name:'Santos, Maria'},
      {idNumber:'2026-0003', name:'Reyes, Mark'}
    ];
    demoStudents.forEach(s=>{
      DB.accounts.push({id:uid('acc'), role:'student', idNumber:s.idNumber, password:s.idNumber, name:s.name, sectionId:sec.id});
    });
    const items = [
      {subjectId:subj.id, period:'midterm', category:'exam', name:'Midterm Exam', maxScore:50, date:'2026-08-01'},
      {subjectId:subj.id, period:'midterm', category:'formative', name:'Quiz 1', maxScore:20, date:'2026-07-10'},
      {subjectId:subj.id, period:'midterm', category:'summative', name:'Unit Test 1', maxScore:30, date:'2026-07-25'},
      {subjectId:subj.id, period:'midterm', category:'performance', name:'Lab Activity 1', maxScore:25, date:'2026-07-15'}
    ];
    items.forEach(it=>DB.items.push({id:uid('itm'), ...it}));
    const acc = DB.accounts.filter(a=>a.role==='student');
    const sample = {'Dela Cruz, Juan':[42,18,26,22], 'Santos, Maria':[47,20,28,24], 'Reyes, Mark':[35,15,21,19]};
    acc.forEach(a=>{
      const vals = sample[a.name];
      items.forEach((it,idx)=>{
        DB.scores.push({studentId:a.id, itemId: DB.items.find(x=>x.name===it.name).id, score:vals[idx]});
      });
    });
    changed = true;
  }
  if(changed) saveDB();
}

/* ============================= GRADE COMPUTE ============================= */
function computeGrade(studentId, subjectId, period){
  const subject = DB.subjects.find(s=>s.id===subjectId);
  if(!subject) return {total:0, details:{}, complete:false};
  const items = DB.items.filter(i=>i.subjectId===subjectId && i.period===period);
  let total = 0, details = {}, allComplete = true;
  subject.rubric.forEach(cat=>{
    const catItems = items.filter(i=>i.category===cat.key);
    if(catItems.length===0){
      details[cat.key] = {label:cat.label, weight:cat.weight, group:cat.group, ratio:null, contribution:0, itemCount:0};
      allComplete = false;
      return;
    }
    let sumRatio=0, missing=false;
    catItems.forEach(it=>{
      const sc = DB.scores.find(s=>s.studentId===studentId && s.itemId===it.id);
      if(!sc) missing = true;
      const val = sc? Number(sc.score) : 0;
      const max = Number(it.maxScore)||1;
      sumRatio += (val/max);
    });
    if(missing) allComplete = false;
    const avgRatio = sumRatio/catItems.length;
    const contribution = avgRatio*cat.weight;
    total += contribution;
    details[cat.key] = {label:cat.label, weight:cat.weight, group:cat.group, ratio:avgRatio, contribution, itemCount:catItems.length};
  });
  return {total, details, complete: allComplete};
}

/* ============================= HELPERS ============================= */
function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);

}
function esc(str){ return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function pct(n){ return (Math.round(n*100)/100).toFixed(2)+'%'; }

  });

function exportToExcel(){
  const wb = XLSX.utils.book_new();
  const usedNames = new Set();
  DB.subjects.forEach(subj=>{
    const students = DB.accounts.filter(a=>a.role==='student' && a.sectionId===subj.sectionId);
    ['midterm','final'].forEach(period=>{
      const items = DB.items.filter(i=>i.subjectId===subj.id && i.period===period);
      const header = ['Student ID','Student Name', ...items.map(it=>`${it.name} (/${it.maxScore})`), ...subj.rubric.map(c=>`${c.label} (${c.weight}%)`), 'TOTAL GRADE %'];
      const rows = students.map(stu=>{
        const g = computeGrade(stu.id, subj.id, period);
        const itemVals = items.map(it=>{
          const sc = DB.scores.find(s=>s.studentId===stu.id && s.itemId===it.id);
          return sc ? sc.score : '';
        });
        const catVals = subj.rubric.map(c=>{
          const d = g.details[c.key];
          return d.ratio===null ? '' : Math.round(d.contribution*100)/100;
        });
        return [stu.idNumber, stu.name, ...itemVals, ...catVals, Math.round(g.total*100)/100];
      });
      const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
      let sheetName = `${subj.name} ${period}`.slice(0,31).replace(/[\\/*?:\[\]]/g,'');
      let finalName = sheetName, n = 1;
      while(usedNames.has(finalName)){ finalName = (sheetName.slice(0,28)+'_'+(++n)); }
      usedNames.add(finalName);
      XLSX.utils.book_append_sheet(wb, ws, finalName || `Sheet${n}`);
    });
  });
  if(wb.SheetNames.length===0){ toast('Nothing to export yet — add subjects and students first'); return; }
  XLSX.writeFile(wb, `PSU_Bayambang_Grades_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel file downloaded');
}

function eventsSections(){

    if(!name) return;
    DB.sections.push({id:uid('sec'), name});
    saveDB(); toast('Section added'); render();
  };
  document.querySelectorAll('.add-student-form').forEach(f=>{
    f.onsubmit = (e)=>{
      e.preventDefault();
      const sectionId = f.dataset.section;
      const name = f.querySelector('.stu-name').value.trim();
      const idNumber = f.querySelector('.stu-id').value.trim();
      if(!name || !idNumber) return;
      if(DB.accounts.some(a=>a.idNumber===idNumber && a.role==='student')){ toast('That ID number already exists'); return; }
      DB.accounts.push({id:uid('acc'), role:'student', idNumber, password:idNumber, name, sectionId});
      saveDB(); toast('Student added — default password is their ID number'); render();
    };
  });
  document.querySelectorAll('[data-reset-pw]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.resetPw;
      const acc = DB.accounts.find(a=>a.id===id);
      const newPw = prompt(`Set a new password for ${acc.name}:`, acc.password);
      if(newPw===null || newPw.trim()==='') return;
      acc.password = newPw.trim();
      saveDB(); toast('Password updated'); render();
    };
  });
  document.querySelectorAll('[data-del-student]').forEach(b=>{
    b.onclick = ()=>{
      if(!confirm('Remove this student and their scores?')) return;
      const id = b.dataset.delStudent;
      DB.accounts = DB.accounts.filter(a=>a.id!==id);
      DB.scores = DB.scores.filter(s=>s.studentId!==id);
      saveDB(); render();
    };
  });
  document.querySelectorAll('[data-del-section]').forEach(b=>{
    b.onclick = ()=>{
      if(!confirm('Delete this section, its students, subjects, items and scores? This cannot be undone.')) return;
      const id = b.dataset.delSection;
      const studentIds = DB.accounts.filter(a=>a.sectionId===id).map(a=>a.id);
      const subjectIds = DB.subjects.filter(s=>s.sectionId===id).map(s=>s.id);
      const itemIds = DB.items.filter(i=>subjectIds.includes(i.subjectId)).map(i=>i.id);
      DB.sections = DB.sections.filter(s=>s.id!==id);
      DB.accounts = DB.accounts.filter(a=>a.sectionId!==id);
      DB.subjects = DB.subjects.filter(s=>s.sectionId!==id);
      DB.items = DB.items.filter(i=>!subjectIds.includes(i.subjectId));
      DB.scores = DB.scores.filter(s=>!studentIds.includes(s.studentId) && !itemIds.includes(s.itemId));
      saveDB(); render();
    };
  });
  const tmplBtn = document.getElementById('downloadStudentTemplateBtn');
  if(tmplBtn) tmplBtn.onclick = ()=>{
    const csv = 'StudentID,Name\n2026-0004,Bautista, Ana\n';
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'student_import_template.csv'; a.click();
  };
  const stuFileInput = document.getElementById('studentImportFile');
  if(stuFileInput) stuFileInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const sectionId = document.getElementById('studentImportSection').value;
    const isExcel = /\.xlsx?$/i.test(file.name);
    if(isExcel){
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        const csv = XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
        parseStudentImportCsv(csv, sectionId);
      };
      reader.readAsArrayBuffer(file);
    } else {
      const reader = new FileReader();
      reader.onload = (ev)=>parseStudentImportCsv(ev.target.result, sectionId);
      reader.readAsText(file);
    }
  };
}
let pendingStudentRows = null;
function parseStudentImportCsv(csvText, sectionId){
  const result = Papa.parse(csvText.trim(), {header:true, skipEmptyLines:true});
  const preview = result.data.map((r,idx)=>{
    const idNumber = (r.StudentID||'').trim();
    const name = (r.Name||'').trim();
    let issue = null;
    if(!idNumber) issue = 'Missing StudentID';
    else if(!name) issue = 'Missing Name';
    else if(DB.accounts.some(a=>a.role==='student' && a.idNumber===idNumber)) issue = 'ID Number already exists';
    return {row:idx+1, idNumber, name, sectionId, issue};
  });
  pendingStudentRows = preview;
  renderStudentImportPreview();
}
function renderStudentImportPreview(){
  const el = document.getElementById('studentImportPreview');
  if(!el) return;
  if(!pendingStudentRows){ el.innerHTML=''; return; }
  const validCount = pendingStudentRows.filter(r=>!r.issue).length;
  const rowsHtml = pendingStudentRows.map(r=>`
    <tr class="${r.issue?'bg-red-50':''}">
      <td>${r.row}</td><td class="font-mono">${esc(r.idNumber)}</td><td>${esc(r.name)}</td>
      <td class="text-red-600 text-[11.5px]">${r.issue? esc(r.issue):'OK'}</td>
    </tr>`).join('');
  el.innerHTML = `
  <div class="mt-4">
    <div class="flex items-center justify-between mb-2">
      <h4 class="font-display text-[14px]" style="color:var(--green-900)">Preview — ${validCount}/${pendingStudentRows.length} valid</h4>
      <button id="commitStudentImportBtn" class="btn btn-primary btn-sm" ${validCount===0?'disabled':''}>Add ${validCount} Students</button>
    </div>
    <div class="overflow-x-auto">
    <table class="gradebook">
      <thead><tr><th>#</th><th>StudentID</th><th>Name</th><th>Status</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    </div>
  </div>`;
  const btn = document.getElementById('commitStudentImportBtn');
  if(btn) btn.onclick = ()=>{
    pendingStudentRows.filter(r=>!r.issue).forEach(r=>{
      DB.accounts.push({id:uid('acc'), role:'student', idNumber:r.idNumber, password:r.idNumber, name:r.name, sectionId:r.sectionId});
    });
    saveDB();
    pendingStudentRows = null;
    toast('Students imported');
    render();
  };
}

  if(sSel) sSel.onchange = ()=>{ ui.selSubject = sSel.value; render(); };
  const pSel = document.getElementById('gbPeriodSelect');
  if(pSel) pSel.onchange = ()=>{ ui.selPeriod = pSel.value; render(); };
  document.querySelectorAll('.score-cell').forEach(inp=>{
    inp.onchange = ()=>{
      const studentId = inp.dataset.student, itemId = inp.dataset.item;
      const val = inp.value==='' ? null : Number(inp.value);
      let rec = DB.scores.find(s=>s.studentId===studentId && s.itemId===itemId);

        DB.scores = DB.scores.filter(s=>!(s.studentId===studentId && s.itemId===itemId));

      else { DB.scores.push({studentId, itemId, score:val}); }
      saveDB(); render();
    };
  });
}

    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'grade_import_template.csv'; a.click();
  };
  const fileInput = document.getElementById('importFile');
  if(fileInput) fileInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!ui.selSubject){ toast('Select a target subject first'); return; }
    const isExcel = /\.xlsx?$/i.test(file.name);
    if(isExcel){
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        const csv = XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
        parseImportCsv(csv);
      };
      reader.readAsArrayBuffer(file);
    } else {
      const reader = new FileReader();
      reader.onload = (ev)=>parseImportCsv(ev.target.result);
      reader.readAsText(file);
    }
  };
}
function parseImportCsv(csvText){
  const result = Papa.parse(csvText.trim(), {header:true, skipEmptyLines:true});
  const rows = result.data;
  const subj = DB.subjects.find(s=>s.id===ui.selSubject);
  const validCats = subj.rubric.map(c=>c.key);
  const preview = [];
  rows.forEach((r,idx)=>{
    const studentId = (r.StudentID||'').trim();
    const period = (r.Period||'').trim().toLowerCase();
    const category = (r.Category||'').trim().toLowerCase();
    const itemName = (r.ItemName||'').trim();
    const maxScore = Number(r.MaxScore);
    const score = Number(r.Score);
    const student = DB.accounts.find(a=>a.role==='student' && a.idNumber===studentId && a.sectionId===subj.sectionId);
    let issue = null;
    if(!student) issue = 'Unknown Student ID for this subject\'s section';
    else if(!['midterm','final'].includes(period)) issue = 'Invalid Period';
    else if(!validCats.includes(category)) issue = 'Invalid Category for this subject\'s rubric';
    else if(!itemName) issue = 'Missing Item Name';
    else if(!maxScore || isNaN(maxScore)) issue = 'Invalid Max Score';
    else if(isNaN(score)) issue = 'Invalid Score';
    preview.push({row:idx+1, studentId, studentName:student?student.name:'—', period, category, itemName, maxScore, score, issue});
  });
  pendingImportRows = preview;
  renderImportPreview();
}
function renderImportPreview(){
  const el = document.getElementById('importPreview');
  if(!pendingImportRows){ el.innerHTML=''; return; }
  const validCount = pendingImportRows.filter(r=>!r.issue).length;
  const rowsHtml = pendingImportRows.map(r=>`
    <tr class="${r.issue?'bg-red-50':''}">
      <td>${r.row}</td><td class="font-mono">${esc(r.studentId)}</td><td>${esc(r.studentName)}</td>
      <td>${esc(r.period)}</td><td>${esc(r.category)}</td><td>${esc(r.itemName)}</td>
      <td>${r.maxScore}</td><td>${r.score}</td>
      <td class="text-red-600 text-[11.5px]">${r.issue? esc(r.issue):'OK'}</td>
    </tr>`).join('');
  el.innerHTML = `
  <div class="card p-5">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-display text-[15px]" style="color:var(--green-900)">Preview — ${validCount}/${pendingImportRows.length} rows valid</h3>
      <button id="commitImportBtn" class="btn btn-primary btn-sm" ${validCount===0?'disabled':''}>Commit ${validCount} Rows</button>
    </div>
    <div class="overflow-x-auto">
    <table class="gradebook">
      <thead><tr><th>#</th><th>ID</th><th>Name</th><th>Period</th><th>Category</th><th>Item</th><th>Max</th><th>Score</th><th>Status</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    </div>
  </div>`;
  const btn = document.getElementById('commitImportBtn');
  if(btn) btn.onclick = ()=>{
    const subj = DB.subjects.find(s=>s.id===ui.selSubject);
    pendingImportRows.filter(r=>!r.issue).forEach(r=>{
      let item = DB.items.find(i=>i.subjectId===subj.id && i.period===r.period && i.category===r.category && i.name===r.itemName);
      if(!item){
        item = {id:uid('itm'), subjectId:subj.id, period:r.period, category:r.category, name:r.itemName, maxScore:r.maxScore, date:''};
        DB.items.push(item);
      }
      const student = DB.accounts.find(a=>a.idNumber===r.studentId && a.role==='student');
      let rec = DB.scores.find(s=>s.studentId===student.id && s.itemId===item.id);
      if(rec) rec.score = r.score;
      else DB.scores.push({studentId:student.id, itemId:item.id, score:r.score});
    });
    saveDB();
    pendingImportRows = null;
    toast('Import committed');
    render();
  };
}

/* ============================= STUDENT VIEW ============================= */
function renderStudent(){
  const sec = DB.sections.find(s=>s.id===session.sectionId);
  const subjects = DB.subjects.filter(s=>s.sectionId===session.sectionId);
  if(!ui.studentSelSubject && subjects.length) ui.studentSelSubject = subjects[0].id;
  const subj = subjects.find(s=>s.id===ui.studentSelSubject);
  let content = '<p class="text-[13.5px]" style="color:var(--ink-soft)">No subjects available yet.</p>';
  if(subj){
    const g = computeGrade(session.id, subj.id, ui.studentSelPeriod);
    const items = DB.items.filter(i=>i.subjectId===subj.id && i.period===ui.studentSelPeriod);
    const ringColor = g.total>=75? 'var(--green-600)' : g.total>=50? 'var(--gold-500)':'#b3453f';
    const circumference = 2*Math.PI*54;
    const dash = Math.min(g.total,100)/100*circumference;
    const rubricRows = subj.rubric.map(cat=>{
      const d = g.details[cat.key];
      return `<tr>
        <td class="name-cell">${cat.group?'&nbsp;&nbsp;':''}${esc(cat.label)}</td>
        <td class="font-mono">${cat.weight}%</td>
        <td class="font-mono">${d.ratio===null? '—' : pct(d.ratio*100)}</td>
        <td class="font-mono font-bold">${pct(d.contribution)}</td>
      </tr>`;
    }).join('');
    const itemRows = items.map(it=>{
      const sc = DB.scores.find(s=>s.studentId===session.id && s.itemId===it.id);
      const cat = subj.rubric.find(c=>c.key===it.category);
      return `<tr>
        <td class="name-cell">${esc(it.name)}</td>
        <td>${cat?esc(cat.label):''}</td>
        <td class="font-mono">${sc? sc.score : '—'} / ${it.maxScore}</td>
        <td class="font-mono">${it.date||'—'}</td>
      </tr>`;
    }).join('');
    content = `
    <div class="grid md:grid-cols-[220px_1fr] gap-6">
      <div class="card p-6 flex flex-col items-center justify-center">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="54" fill="none" stroke="#e9e5d8" stroke-width="12"/>
          <circle cx="70" cy="70" r="54" fill="none" stroke="${ringColor}" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="${dash} ${circumference}" transform="rotate(-90 70 70)"/>
          <text x="70" y="66" text-anchor="middle" font-family="Lora,serif" font-size="24" font-weight="700" fill="var(--ink)">${pct(g.total).replace('%','')}</text>
          <text x="70" y="84" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="var(--ink-soft)">percent</text>
        </svg>
        <p class="font-display text-[14px] mt-2 text-center" style="color:var(--green-900)">${ui.studentSelPeriod==='midterm'?'Midterm':'Final'} Grade</p>
        ${!g.complete? '<p class="text-[11px] text-center mt-1" style="color:var(--ink-soft)">Some categories have no recorded items yet.</p>':''}
      </div>
      <div>
        <table class="gradebook mb-5">
          <thead><tr><th style="text-align:left">Rubric Component</th><th>Weight</th><th>Your Score %</th><th>Contribution</th></tr></thead>
          <tbody>${rubricRows}</tbody>
        </table>
        <h4 class="font-display text-[14px] mb-2" style="color:var(--green-800)">Individual Items</h4>
        <table class="gradebook">
          <thead><tr><th style="text-align:left">Item</th><th>Category</th><th>Score</th><th>Date</th></tr></thead>
          <tbody>${itemRows || `<tr><td colspan="4" class="text-[13px]" style="color:var(--ink-soft)">No items recorded yet.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
  }
  const subjOptions = subjects.map(s=>`<option value="${s.id}" ${s.id===ui.studentSelSubject?'selected':''}>${esc(s.name)}</option>`).join('');
  return `
  ${headerBar('Student Portal', `
    <button id="accountBtn" class="btn btn-ghost btn-sm" style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)">Change Password</button>
    <span class="text-[13px] text-white/90 mr-2">${esc(session.name)} · ${sec?esc(sec.name):''}</span>
    <button id="logoutBtn" class="btn btn-ghost btn-sm" style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)">Log out</button>
  `)}
  <div class="max-w-5xl mx-auto px-5 py-6">
    ${ui.showAccount? accountSettingsPanel() : `
    <div class="flex items-center justify-between mb-5 flex-wrap gap-3">
      <h2 class="font-display text-[19px]" style="color:var(--green-900)">My Grades</h2>
      <div class="flex items-center gap-3">
        ${subjects.length? `<select id="studentSubjectSelect">${subjOptions}</select>`:''}
        <div class="flex rounded-lg overflow-hidden border" style="border-color:var(--line)">
          <button id="periodMidBtn" class="px-3 py-1.5 text-[12.5px] font-semibold" style="${ui.studentSelPeriod==='midterm'?'background:var(--green-700);color:#fff':'background:#fff;color:var(--ink-soft)'}">Midterm</button>
          <button id="periodFinBtn" class="px-3 py-1.5 text-[12.5px] font-semibold" style="${ui.studentSelPeriod==='final'?'background:var(--green-700);color:#fff':'background:#fff;color:var(--ink-soft)'}">Final</button>
        </div>
      </div>
    </div>
    ${content}
    <p class="text-[11px] mt-6 text-center" style="color:var(--ink-soft)">View-only — contact your instructor to request a correction.</p>`}
  </div>`;
}
function attachStudentEvents(){
  document.getElementById('logoutBtn').onclick = ()=>{ session=null; render(); };
  document.getElementById('accountBtn').onclick = ()=>{ ui.showAccount=true; render(); };
  if(ui.showAccount){ attachAccountEvents(); return; }
  const sSel = document.getElementById('studentSubjectSelect');
  if(sSel) sSel.onchange = ()=>{ ui.studentSelSubject = sSel.value; render(); };
  const mid = document.getElementById('periodMidBtn'), fin = document.getElementById('periodFinBtn');
  if(mid) mid.onclick = ()=>{ ui.studentSelPeriod='midterm'; render(); };
  if(fin) fin.onclick = ()=>{ ui.studentSelPeriod='final'; render(); };
}

/* ============================= INIT ============================= */
(async function init(){
  document.getElementById('app').innerHTML = `<div class="min-h-screen flex items-center justify-center text-[14px]" style="color:var(--ink-soft)">Connecting to cloud database…</div>`;
  try{
    await initFirebase();
  }catch(e){
    return; // initFirebase already rendered a setup-needed message
  }
  subscribeDB(); // live-updates DB and calls render() whenever cloud data changes
})();
</script>
